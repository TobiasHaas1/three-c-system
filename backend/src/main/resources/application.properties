spring.application.name=backend

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_db
spring.datasource.username=ticket_user
spring.datasource.password=ticket_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION SETTINGS
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.ai.ollama.base-url=http://ollama.tailbc353d.ts.net:11434

spring.ai.ollama.chat.model=gemma4:e2b
spring.ai.ollama.chat.options.temperature=0.0