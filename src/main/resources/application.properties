spring.application.name=jira-weclapp-integration
server.port=8080

# --- AI (Ollama) configuration ---
# Point this at any Ollama-compatible endpoint reachable from this service.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:deepseek-r1:8b}
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.format=json

# --- Jira configuration (placeholders - fill in via env vars) ---
jira.domain=${JIRA_DOMAIN:https://your-domain.atlassian.net}
jira.user=${JIRA_USER:your-email@example.com}
jira.token=${JIRA_TOKEN:YOUR_JIRA_API_TOKEN}

# --- Weclapp configuration (placeholders - fill in via env vars) ---
weclapp.url=${WECLAPP_URL:https://your-tenant.weclapp.com/webapp/api/v2}
weclapp.token=${WECLAPP_TOKEN:YOUR_WECLAPP_API_TOKEN}
weclapp.customerId=${WECLAPP_CUSTOMER_ID:YOUR_CUSTOMER_ID}
weclapp.unitId=${WECLAPP_UNIT_ID:YOUR_UNIT_ID}
weclapp.taxId=${WECLAPP_TAX_ID:YOUR_TAX_ID}
weclapp.articleId=${WECLAPP_ARTICLE_ID:YOUR_ARTICLE_ID}
weclapp.unitPrice=${WECLAPP_UNIT_PRICE:0.00}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
